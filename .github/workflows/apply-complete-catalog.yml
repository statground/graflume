name: Apply complete catalog

on:
  push:
    branches:
      - codex/complete-built-in-chart-catalog-20260822
    paths:
      - .github/workflows/apply-complete-catalog.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/catalog-source.part-* > /tmp/catalog.patch.xz.b64
          echo "61d3fca296b13fc3124f43239c034d355a9d4b25e495059a88115efa7614ad49  /tmp/catalog.patch.xz.b64" | sha256sum --check --strict -
          base64 --decode /tmp/catalog.patch.xz.b64 > /tmp/catalog.patch.xz
          xz --decompress --stdout /tmp/catalog.patch.xz > /tmp/catalog.patch
          git apply --index --whitespace=error-all /tmp/catalog.patch
          git rm .github/catalog-source.part-* .github/workflows/apply-complete-catalog.yml
          git diff --cached --check

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run full verification
        run: npm run check

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "Expand the complete built-in chart catalog"
          git push origin HEAD:${GITHUB_REF_NAME}
