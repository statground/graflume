name: Build pinned CDN snapshot

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'schema/**'
      - 'package.json'
      - 'rollup.config.mjs'
      - 'tsconfig*.json'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/cdn-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graflume-cdn-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run checks and build
        run: npm run check

      - name: Commit browser bundles and pin the examples
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"
          VERSION="$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"

          mkdir -p cdn
          cp dist/graflume.global.js cdn/graflume.global.js
          cp dist/graflume.complete.global.js cdn/graflume.complete.global.js
          node - "$VERSION" "$SOURCE_SHA" <<'NODE'
          const fs = require('node:fs');
          const [version, sourceCommit] = process.argv.slice(2);
          fs.writeFileSync(
            'cdn/manifest.json',
            `${JSON.stringify(
              {
                package: 'graflume',
                version,
                sourceCommit,
                entry: './graflume.global.js',
                entries: {
                  default: './graflume.global.js',
                  complete: './graflume.complete.global.js',
                },
              },
              null,
              2,
            )}\n`,
          );
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add cdn/graflume.global.js cdn/graflume.complete.global.js cdn/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build Graflume CDN snapshots [skip ci]'
          fi

          BUNDLE_SHA="$(git log -1 --format=%H -- cdn/graflume.complete.global.js)"
          DEFAULT_SRI="sha384-$(openssl dgst -sha384 -binary cdn/graflume.global.js | openssl base64 -A)"
          COMPLETE_SRI="sha384-$(openssl dgst -sha384 -binary cdn/graflume.complete.global.js | openssl base64 -A)"

          node scripts/pin-cdn-examples.mjs "$BUNDLE_SHA" "$DEFAULT_SRI" "$COMPLETE_SRI"
          git add \
            examples/cdn/bar-chart.html \
            examples/cdn/chart-types.html \
            examples/cdn/complete-chart-types.html \
            examples/cdn/additional-chart-types.html \
            examples/cdn/series-chart-types.html
          if ! git diff --cached --quiet; then
            git commit -m 'Pin Graflume CDN examples [skip ci]'
          fi

          git push origin HEAD:main

          verify_bundle() {
            local filename="$1"
            local expected_sri="$2"
            local output="$3"
            local url="https://cdn.jsdelivr.net/gh/statground/graflume@${BUNDLE_SHA}/cdn/${filename}"
            local verified=false
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                "$url" --output "$output"; then
                local actual_sri
                actual_sri="sha384-$(openssl dgst -sha384 -binary "$output" | openssl base64 -A)"
                if [ "$actual_sri" = "$expected_sri" ] && cmp -s "cdn/${filename}" "$output"; then
                  verified=true
                  break
                fi
              fi
              sleep 3
            done
            if [ "$verified" != true ]; then
              echo "The exact jsDelivr response did not match ${filename}." >&2
              exit 1
            fi
          }

          verify_bundle 'graflume.global.js' "$DEFAULT_SRI" /tmp/graflume.default.cdn.js
          verify_bundle 'graflume.complete.global.js' "$COMPLETE_SRI" /tmp/graflume.complete.cdn.js

          VERIFIED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DEFAULT_URL="https://cdn.jsdelivr.net/gh/statground/graflume@${BUNDLE_SHA}/cdn/graflume.global.js"
          COMPLETE_URL="https://cdn.jsdelivr.net/gh/statground/graflume@${BUNDLE_SHA}/cdn/graflume.complete.global.js"
          DEFAULT_BYTES="$(wc -c < /tmp/graflume.default.cdn.js | tr -d ' ')"
          COMPLETE_BYTES="$(wc -c < /tmp/graflume.complete.cdn.js | tr -d ' ')"
          node - \
            "$SOURCE_SHA" "$BUNDLE_SHA" "$DEFAULT_URL" "$DEFAULT_SRI" "$DEFAULT_BYTES" \
            "$COMPLETE_URL" "$COMPLETE_SRI" "$COMPLETE_BYTES" "$VERIFIED_AT" <<'NODE'
          const fs = require('node:fs');
          const [
            sourceCommit,
            bundleCommit,
            defaultUrl,
            defaultIntegrity,
            defaultByteLength,
            completeUrl,
            completeIntegrity,
            completeByteLength,
            verifiedAt,
          ] = process.argv.slice(2);
          fs.writeFileSync(
            'cdn/verification.json',
            `${JSON.stringify(
              {
                sourceCommit,
                bundleCommit,
                cdnUrl: defaultUrl,
                integrity: defaultIntegrity,
                byteLength: Number(defaultByteLength),
                complete: {
                  cdnUrl: completeUrl,
                  integrity: completeIntegrity,
                  byteLength: Number(completeByteLength),
                },
                verifiedAt,
              },
              null,
              2,
            )}\n`,
          );
          NODE

          git add cdn/verification.json
          git commit -m 'Verify Graflume CDN snapshots [skip ci]'
          git push origin HEAD:main
