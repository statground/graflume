name: Development source artifact

on:
  push:
    branches:
      - codex/expand-advanced-chart-catalog-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: graflume-source
          path: .
          include-hidden-files: true
          retention-days: 1
