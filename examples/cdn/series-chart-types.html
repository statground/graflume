        const presentedLayers = spec.layers?.map((layer) => ({
          ...layer,
          ...(layer.x === undefined ? {} : { x: { ...layer.x, title: story.xTitle } }),
          ...(layer.y === undefined ? {} : { y: { ...layer.y, title: story.yTitle } }),
        }));
        const hideAxes =
          axislessFamilies.includes(familyId) ||
          ['map', 'radial', 'relationship'].includes(category);
        return {
          ...spec,
          ...(spec.x === undefined ? {} : { x: { ...spec.x, title: story.xTitle } }),
          ...(spec.y === undefined ? {} : { y: { ...spec.y, title: story.yTitle } }),
          ...(presentedLayers === undefined ? {} : { layers: presentedLayers }),
          title: { text: name, subtitle: story.subtitle },
          accessibility: {
            label: `${name}: ${story.subtitle}`,
            description: `${story.subtitle}. The example uses curated, deterministic data and exposes its exact values in a semantic table.`,
          },
          ...(hideAxes ? { axes: { x: false, y: false } } : {}),
        };
      }
      const gallery = document.querySelector('#gallery');
      const status = document.querySelector('#status');
      const themeSelect = document.querySelector('#theme');
      const categorySelect = document.querySelector('#category');
      let charts = [];
      let themeCatalog = [];
      let currentThemeId = '';

      const applyThemeShell = () => {
        const current = themeCatalog.find(({ id }) => id === currentThemeId) ?? themeCatalog[0];
        if (!current) throw new Error('Graflume did not expose a built-in theme.');
        currentThemeId = current.id;
        document.documentElement.dataset.theme = current.tokens.mode;
        themeSelect.value = currentThemeId;
      };

      [...new Set(definitions.map(({ category }) => category))].sort().forEach((category) => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        categorySelect.append(option);
      });

      const render = async () => {
        charts.forEach((chart) => chart.destroy());
        charts = [];
        gallery.replaceChildren();
        const selected = categorySelect.value;
        const visible = definitions.filter(
          ({ category }) => selected === 'all' || category === selected,
        );
        status.textContent = visible.length + '개 차트를 렌더링하고 있습니다…';

        for (let index = 0; index < visible.length; index += 1) {
          const definition = visible[index];
          const article = document.createElement('article');
          const modes = definition.variants.map(({ mode }) => mode).join(', ') || 'default';
          article.innerHTML =
            '<div class="head"><div><h2>' +
            definition.name +
            '</h2><p class="copy"><code>Graflume.' +
            definition.quickApi +
            '()</code><br />통합 모드: ' +
            modes +
            '</p></div><span class="badge">' +
            definition.variants.length +
            ' presets</span></div><div class="chart" id="chart-' +
            definition.id +
            '"></div>';
          gallery.append(article);
          const spec = seriesSampleSpec(definition);
          charts.push(
            Graflume.create('#chart-' + definition.id, {
              ...spec,
              height: 300,
              theme: currentThemeId,
            }),
          );
          if (index % 8 === 7) await new Promise((resolve) => requestAnimationFrame(resolve));
        }
        status.textContent = visible.length + '개 차트 렌더링이 완료되었습니다.';
      };

      try {
        if (!window.Graflume) throw new Error('Graflume complete browser bundle was not loaded.');
        themeCatalog = Array.from(Graflume.builtInThemeCatalog);
        if (themeCatalog.length === 0) throw new Error('Graflume did not expose a built-in theme.');
        const runtimeDefaultThemeId = Graflume.defaultThemeId;
        currentThemeId = themeCatalog.some(({ id }) => id === runtimeDefaultThemeId)
          ? runtimeDefaultThemeId
          : themeCatalog[0].id;
        themeSelect.replaceChildren(
          ...themeCatalog.map(({ id }) => {
            const option = document.createElement('option');
            option.value = id;
            option.textContent = id;
            return option;
          }),
        );
        applyThemeShell();
        themeSelect.addEventListener('change', () => {
          currentThemeId = themeSelect.value;
          applyThemeShell();
          render();
        });
        categorySelect.addEventListener('change', render);
        render();
      } catch (error) {
        status.classList.add('error');
        status.textContent = error instanceof Error ? error.message : String(error);
        console.error(error);
      }
    </script>
  </body>
</html>
