      }

        font-size: clamp(1.8rem, 4vw, 3rem);
        letter-spacing: -0.05em;
      }
      .lede {
        max-width: 960px;
        margin: 10px 0 0;
        color: #64748b;
        line-height: 1.7;
      }
      :root[data-theme='dark'] .lede,
      :root[data-theme='dark'] .copy {
        color: #a7b2c5;
      }
      button,
      select {
        min-height: 42px;
        padding: 0 16px;
        color: inherit;
        background: #fff;
        border: 1px solid #dbe3ee;
        border-radius: 999px;
        font: inherit;
        font-weight: 700;
      }
      :root[data-theme='dark'] button,
      :root[data-theme='dark'] select {
        background: #111827;
        border-color: #475569;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #818cf8;
        outline-offset: 2px;
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      #status {
        margin: 0 0 18px;
        padding: 12px 15px;
        background: #eef2ff;
        border-radius: 12px;
      }
      :root[data-theme='dark'] #status {
        background: #1e1b4b;
      }
      #status.error {
        color: #991b1b;
        background: #fee2e2;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      article {
        min-width: 0;
        overflow: hidden;
        background: #fff;
        border: 1px solid #dbe3ee;
        border-radius: 18px;
        box-shadow: 0 14px 42px rgb(15 23 42 / 8%);
      }
      :root[data-theme='dark'] article {
        background: #111827;
        border-color: #25314a;
        box-shadow: 0 18px 48px rgb(0 0 0 / 30%);
      }
      .head {
        display: flex;
        gap: 12px;
        align-items: start;
        justify-content: space-between;
        padding: 17px 18px 0;
      }
      h2 {
        margin: 0;
        font-size: 1.05rem;
      }
      .copy {
        margin: 5px 0 0;
        color: #64748b;
        font-size: 0.82rem;
        line-height: 1.45;
      }
      code {
        color: #4f46e5;
        font-size: 0.75rem;
      }
      :root[data-theme='dark'] code {
        color: #c4b5fd;
      }
      .badge {
        flex: 0 0 auto;
        padding: 4px 8px;
        color: #4338ca;
        background: #eef2ff;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 800;
      }
      :root[data-theme='dark'] .badge {
        color: #c7d2fe;
        background: #312e81;
      }
      .chart {
        width: 100%;
        height: 300px;
      }
      @media (max-width: 1120px) {
        .gallery {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 720px) {
        header {
          display: block;
        }
        .controls {
          margin-top: 14px;
        }
        .gallery {
          grid-template-columns: 1fr;
        }
        .chart {
          height: 320px;
        }
      }
    </style>
  </head>

          <p class="lede">
            기존 45개 계열과 같은 portable ChartSpec, renderer-neutral Scene, Canvas renderer를
            사용하는 96개 전문 시리즈입니다. 중복 의미는 canonical compiler로 융합됩니다.
          </p>
        </div>
        <div class="controls">
          <select id="category" aria-label="카테고리 필터">

          </select>
          <button id="theme" type="button">어두운 테마</button>
        </div>
      </header>
      <p id="status" role="status">전문 시리즈를 렌더링하고 있습니다…</p>
      <section id="gallery" class="gallery" aria-label="Graflume 전문 시리즈 갤러리"></section>
    </main>

              theme: dark ? 'graflume-dark' : 'graflume-light',

      } catch (error) {
        status.classList.add('error');
        status.textContent = error instanceof Error ? error.message : String(error);
        console.error(error);
