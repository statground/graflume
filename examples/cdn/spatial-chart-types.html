<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Graflume 공간 차트 갤러리</title>
    <style>
      :root {
        font-family: Inter, Pretendard, system-ui, sans-serif;
        color: #0f172a;
        background: #f1f5f9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px 16px 52px;
      }
      main {
        width: min(1480px, 100%);
        margin: 0 auto;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 3rem);
        letter-spacing: -0.05em;
      }
      .lede {
        max-width: 920px;
        margin: 10px 0 20px;
        color: #64748b;
        line-height: 1.7;
      }
      .theme-control {
        margin: 0 0 16px;
        padding: 9px 13px;
        color: #3730a3;
        background: #fff;
        border: 1px solid #c7d2fe;
        border-radius: 10px;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
      .theme-control:focus-visible {
        outline: 3px solid #818cf8;
        outline-offset: 2px;
      }
      #status {
        margin: 0 0 18px;
        padding: 12px 15px;
        background: #eef2ff;
        border-radius: 12px;
      }
      #status.error {
        color: #991b1b;
        background: #fee2e2;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      article {
        min-width: 0;
        overflow: hidden;
        background: #fff;
        border: 1px solid #dbe3ee;
        border-radius: 18px;
        box-shadow: 0 14px 42px rgb(15 23 42 / 8%);
      }
      .head {
        display: flex;
        gap: 12px;
        align-items: start;
        justify-content: space-between;
        padding: 16px 18px 12px;
      }
      h2 {
        margin: 0;
        font-size: 1.05rem;
      }
      .copy {
        margin: 5px 0 0;
        color: #64748b;
        font-size: 0.82rem;
        line-height: 1.45;
      }
      code {
        color: #4f46e5;
        font-size: 0.76rem;
      }
      .badge {
        flex: 0 0 auto;
        padding: 4px 8px;
        color: #4338ca;
        background: #eef2ff;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 800;
      }
      .chart {
        width: 100%;
        height: 360px;
        border-top: 1px solid #e2e8f0;
      }
      @media (max-width: 760px) {
        .gallery {
          grid-template-columns: 1fr;
        }
        .chart {
          height: 340px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Graflume 공간 차트 갤러리</h1>
      <p class="lede">
        별도 공간 entry의 실제 GPU renderer로 surface, volume, spatial-vector와 map의 globe mode를
        그립니다. 차트의 타이트한 도구막대, 드래그, Control/Command+wheel, 키보드, tooltip,
        fullscreen과 PNG를 직접 시험할 수 있습니다.
      </p>
      <button id="theme" class="theme-control" type="button">다음 테마</button>
      <p id="status" role="status">8개 공간 차트를 렌더링하고 있습니다…</p>
      <section id="gallery" class="gallery" aria-label="Graflume 공간 차트 갤러리"></section>
    </main>

    <!-- Exact commit pin and SRI are replaced by the repository CDN snapshot workflow. -->
    <script
      src="https://cdn.jsdelivr.net/gh/statground/graflume@5463dc62e2da3259a4c652f6eb2dd316c0867f95/cdn/graflume.spatial.global.js"
      integrity="sha384-dlMBTt2/rzsyv35176WT2XE1zG0OyxjlWJiduKZv3LvKO73TqIDeVlFCekuma2DB"
      crossorigin="anonymous"
    ></script>
    <script>
      (() => {
        const api = window.GraflumeSpatial;
        const status = document.querySelector('#status');
        const gallery = document.querySelector('#gallery');
        const themeButton = document.querySelector('#theme');
        const instances = [];
        let themeIndex = 0;

        const coolToWarm = [
          '#075985',
          '#0284c7',
          '#06b6d4',
          '#34d399',
          '#facc15',
          '#f97316',
          '#be123c',
        ];
        const flowPalette = [
          '#1d4ed8',
          '#2563eb',
          '#0891b2',
          '#0f766e',
          '#65a30d',
          '#ca8a04',
          '#ea580c',
          '#db2777',
          '#7c3aed',
        ];
        const paletteColor = (palette, amount) =>
          palette[
            Math.max(0, Math.min(palette.length - 1, Math.round(amount * (palette.length - 1))))
          ];
        const surfaceData = () => {
          const rows = 35;
          const columns = 35;
          const x = Array.from({ length: columns }, (_, index) => -3 + (index * 6) / (columns - 1));
          const y = Array.from({ length: rows }, (_, index) => -3 + (index * 6) / (rows - 1));
          const z = [];
          const values = [];
          for (const depth of y) {
            for (const horizontal of x) {
              const westernPeak =
                1.8 * Math.exp(-((horizontal + 1.15) ** 2 * 1.05 + (depth + 0.6) ** 2 * 0.8));
              const easternPeak =
                1.35 * Math.exp(-((horizontal - 1.25) ** 2 * 0.72 + (depth - 0.85) ** 2 * 1.15));
              const basin =
                -0.72 * Math.exp(-((horizontal - 0.1) ** 2 + (depth + 0.15) ** 2) * 2.6);
              const height =
                westernPeak +
                easternPeak +
                basin +
                0.26 * Math.sin(horizontal * 2.15) * Math.cos(depth * 1.75);
              z.push(height);
              values.push(height + Math.hypot(horizontal, depth) * 0.06);
            }
          }
          return { rows, columns, x, y, z, values };
        };
        const meshData = () => {
          const rows = 25;
          const columns = 36;
          const positions = [];
          const triangles = [];
          const colors = [];
          const labels = [];
          for (let row = 0; row < rows; row += 1) {
            const vertical = row / (rows - 1);
            const height = -1.8 + vertical * 3.6;
            for (let column = 0; column < columns; column += 1) {
              const angle = (column / columns) * Math.PI * 2;
              const taper = 0.72 + Math.sin(vertical * Math.PI) * 0.78;
              const ripple = 1 + Math.cos(angle * 5 + vertical * Math.PI * 2) * 0.13;
              const radius = taper * ripple;
              positions.push([
                Math.cos(angle) * radius,
                height + Math.sin(angle * 3) * 0.12 * Math.sin(vertical * Math.PI),
                Math.sin(angle) * radius,
              ]);
              colors.push(
                paletteColor(coolToWarm, vertical * 0.82 + (Math.sin(angle * 2) + 1) * 0.045),
              );
              labels.push(`shell ${row + 1}:${column + 1}`);
            }
          }
          for (let row = 0; row < rows - 1; row += 1) {
            for (let column = 0; column < columns; column += 1) {
              const next = (column + 1) % columns;
              const a = row * columns + column;
              const b = row * columns + next;
              const c = (row + 1) * columns + column;
              const d = (row + 1) * columns + next;
              triangles.push([a, c, b], [b, c, d]);
            }
          }
          return { positions, triangles, colors, labels };
        };
        const volumeData = () => {
          const size = 19;
          const values = [];
          for (let z = 0; z < size; z += 1)
            for (let y = 0; y < size; y += 1)
              for (let x = 0; x < size; x += 1) {
                const px = (x / (size - 1)) * 3 - 1.5;
                const py = (y / (size - 1)) * 3 - 1.5;
                const pz = (z / (size - 1)) * 3 - 1.5;
                const first = Math.exp(
                  -(
                    ((px + 0.58) / 0.62) ** 2 +
                    ((py - 0.12) / 0.82) ** 2 +
                    ((pz + 0.18) / 0.58) ** 2
                  ),
                );
                const second =
                  0.92 *
                  Math.exp(
                    -(
                      ((px - 0.63) / 0.72) ** 2 +
                      ((py + 0.25) / 0.52) ** 2 +
                      ((pz - 0.35) / 0.76) ** 2
                    ),
                  );
                const ring =
                  0.62 * Math.exp(-(((Math.hypot(px, pz) - 0.92) / 0.22) ** 2 + (py / 0.28) ** 2));
                values.push(
                  first +
                    second +
                    ring +
                    0.08 * Math.cos(px * 3.2) * Math.sin(pz * 3.1) * Math.exp(-py * py),
                );
              }
          return {
            dimensions: [size, size, size],
            origin: [-1.5, -1.5, -1.5],
            spacing: [3 / (size - 1), 3 / (size - 1), 3 / (size - 1)],
            values,
          };
        };
        const cycloneData = () => {
          const side = 11;
          const origins = [];
          const vectors = [];
          const colors = [];
          const labels = [];
          for (let depthIndex = 0; depthIndex < side; depthIndex += 1) {
            for (let horizontalIndex = 0; horizontalIndex < side; horizontalIndex += 1) {
              const x = -2.5 + (horizontalIndex / (side - 1)) * 5;
              const z = -2.5 + (depthIndex / (side - 1)) * 5;
              const radius = Math.hypot(x, z);
              const swirl = 0.34 + 1.28 * Math.exp(-radius * 0.48);
              const divisor = Math.max(0.36, radius);
              origins.push([x, -0.82 + 0.06 * Math.sin(x + z), z]);
              vectors.push([
                (-z / divisor) * swirl,
                0.28 + 0.92 * Math.exp(-radius * radius * 0.34),
                (x / divisor) * swirl,
              ]);
              colors.push(paletteColor(coolToWarm, 1 - Math.min(1, radius / 3.6)));
              labels.push(`cyclone ${depthIndex + 1}:${horizontalIndex + 1}`);
            }
          }
          return { origins, vectors, colors, labels };
        };
        const streamData = () => {
          const paths = Array.from({ length: 9 }, (_, pathIndex) => {
            const phase = (pathIndex / 9) * Math.PI * 2;
            return Array.from({ length: 58 }, (_, pointIndex) => {
              const amount = pointIndex / 57;
              const angle = phase + amount * Math.PI * 4.4;
              const radius = 0.42 + amount * 1.08 + Math.sin(amount * Math.PI * 3 + phase) * 0.055;
              return [
                Math.cos(angle) * radius,
                -1.8 + amount * 3.6 + Math.sin(phase * 2) * 0.1,
                Math.sin(angle) * radius,
              ];
            });
          });
          return {
            paths,
            labels: paths.map((_, index) => `helical flow ${index + 1}`),
            colors: flowPalette,
          };
        };
        const noise = (index, salt) => {
          const value = Math.sin(index * 12.9898 + salt * 78.233) * 43758.5453;
          return value - Math.floor(value);
        };
        const scatterData = () => {
          const positions = [];
          const values = [];
          const sizes = [];
          const colors = [];
          const labels = [];
          for (let arm = 0; arm < 3; arm += 1) {
            for (let index = 0; index < 160; index += 1) {
              const amount = index / 159;
              const radius = 0.22 + amount * 2.85;
              const jitter = (noise(index + arm * 160, 1) - 0.5) * (0.1 + amount * 0.22);
              const angle = (arm / 3) * Math.PI * 2 + radius * 2.05 + jitter;
              positions.push([
                Math.cos(angle) * (radius + jitter),
                (noise(index + arm * 160, 2) - 0.5) * (0.42 - amount * 0.25),
                Math.sin(angle) * (radius + jitter),
              ]);
              values.push(amount);
              sizes.push(3 + (1 - amount) * 4 + noise(index, arm + 4) * 2);
              colors.push(paletteColor(flowPalette, amount * 0.8 + arm * 0.06));
              labels.push(`arm ${arm + 1} · star ${index + 1}`);
            }
          }
          for (let index = 0; index < 96; index += 1) {
            const longitude = noise(index, 6) * Math.PI * 2;
            const latitude = (noise(index, 7) - 0.5) * Math.PI;
            const radius = Math.cbrt(noise(index, 8)) * 0.52;
            positions.push([
              Math.cos(longitude) * Math.cos(latitude) * radius,
              Math.sin(latitude) * radius * 0.58,
              Math.sin(longitude) * Math.cos(latitude) * radius,
            ]);
            values.push(1);
            sizes.push(5 + noise(index, 9) * 5);
            colors.push(index % 3 === 0 ? '#fef3c7' : '#fbbf24');
            labels.push(`core star ${index + 1}`);
          }
          return { positions, values, sizes, colors, labels };
        };
        const common = (title, background, camera, lighting) => ({
          title,
          theme: themeCycle[themeIndex].id,
          ...(themeCycle[themeIndex].tokens.colors.panel === undefined ? { background } : {}),
          camera,
          lighting,
          interaction: { controls: true, picking: true, tooltip: true, wheel: 'modifier' },
          accessibility: { table: true, maxRows: 80 },
        });
        const light = (direction = [-0.45, 0.9, 0.55]) => ({
          ambient: 0.36,
          diffuse: 0.92,
          direction,
        });
        const volume = volumeData();
        const cyclone = cycloneData();
        const streams = streamData();
        const galaxy = scatterData();
        const definitions = [
          {
            id: 'surface',
            title: 'Surface',
            family: 'surface',
            api: 'surface()',
            copy: '35×35 정규 격자의 다봉형 높이와 연속 색상',
            render: (target) =>
              api.surface(target, surfaceData(), {
                ...common(
                  'Multi-peak terrain surface',
                  '#f8fafc',
                  { yaw: 0.3, pitch: 0.5, distance: 9.6, fov: 42 },
                  light(),
                ),
                color: '#be123c',
                opacity: 1,
              }),
          },
          {
            id: 'mesh',
            title: 'Mesh',
            family: 'surface',
            api: 'mesh()',
            copy: '900개 정점과 1,728개 삼각형의 다색 shell',
            render: (target) =>
              api.mesh(target, meshData(), {
                ...common(
                  'Faceted shell mesh',
                  '#07111f',
                  { yaw: 0.72, pitch: 0.4, distance: 7.8, fov: 40 },
                  light([-0.65, 0.72, 0.48]),
                ),
                opacity: 1,
              }),
          },
          {
            id: 'volume',
            title: 'Volume',
            family: 'volume',
            api: 'volume()',
            copy: '19³ 스칼라 격자에서 고른 5,200개 투명 scalar sample',
            render: (target) =>
              api.volume(target, volume, {
                ...common(
                  'Sampled scalar cloud',
                  '#050b18',
                  { yaw: 0.68, pitch: 0.4, distance: 9, fov: 40 },
                  { ambient: 0.52, diffuse: 0.76, direction: [-0.38, 0.82, 0.62] },
                ),
                maxSamples: 5200,
                pointSize: 4.6,
                opacity: 1,
                colorLow: 'rgba(14, 165, 233, 0.01)',
                colorHigh: 'rgba(251, 113, 133, 0.82)',
              }),
          },
          {
            id: 'isosurface',
            title: 'Isosurface',
            family: 'volume',
            api: 'isosurface()',
            copy: 'ring과 다중 peak가 결합된 실제 삼각형 경계',
            render: (target) =>
              api.isosurface(target, volume, {
                ...common(
                  'Multi-lobe isosurface',
                  '#f8fafc',
                  { yaw: 0, pitch: 0.45, distance: 3.6, fov: 40 },
                  light([-0.55, 0.88, 0.42]),
                ),
                isoValue: 0.43,
                colorHigh: '#7c3aed',
                opacity: 1,
              }),
          },
          {
            id: 'vector-cone',
            title: 'Vector cone',
            family: 'spatial-vector',
            api: 'vectorCone()',
            copy: '11×11 cyclone field의 방향·크기·색상',
            render: (target) =>
              api.vectorCone(target, cyclone, {
                ...common(
                  'Cyclone vector field',
                  '#f8fafc',
                  { yaw: 0.72, pitch: 0.5, distance: 8.6, fov: 44 },
                  light(),
                ),
                scale: 0.52,
                radius: 0.085,
                segments: 10,
              }),
          },
          {
            id: 'streamtube',
            title: 'Streamtube',
            family: 'spatial-vector',
            api: 'streamtube()',
            copy: '9개 경로와 522개 point로 만든 다중 helix',
            render: (target) =>
              api.streamtube(target, streams, {
                ...common(
                  'Multi-helix streamtubes',
                  '#07111f',
                  { yaw: 0.68, pitch: 0.4, distance: 7.3, fov: 40 },
                  light([-0.35, 0.9, 0.5]),
                ),
                radius: 0.045,
                segments: 8,
              }),
          },
          {
            id: 'spatial-scatter',
            title: 'Spatial scatter',
            family: 'spatial-vector',
            api: 'spatialScatter()',
            copy: '576개 depth-tested point의 3-arm galaxy cluster',
            render: (target) =>
              api.spatialScatter(
                target,
                galaxy,
                common(
                  'Clustered galaxy scatter',
                  '#050b18',
                  { yaw: -0.58, pitch: 0.5, distance: 7.5, fov: 42 },
                  { ambient: 0.58, diffuse: 0.72, direction: [-0.4, 0.78, 0.66] },
                ),
              ),
          },
          {
            id: 'globe',
            title: 'Globe',
            family: 'map mode',
            api: 'globe()',
            copy: 'bundled Natural Earth sphere, points, routes',
            render: (target) =>
              api.globe(
                target,
                {
                  points: [
                    { longitude: 126.978, latitude: 37.5665, label: 'Seoul', value: 96 },
                    { longitude: -74.006, latitude: 40.7128, label: 'New York', value: 88 },
                    { longitude: 151.2093, latitude: -33.8688, label: 'Sydney', value: 74 },
                  ],
                  routes: [
                    { from: [126.978, 37.5665], to: [-74.006, 40.7128], label: 'Seoul–New York' },
                    { from: [126.978, 37.5665], to: [151.2093, -33.8688], label: 'Seoul–Sydney' },
                  ],
                },
                {
                  ...common(
                    'Globe',
                    '#050b18',
                    { yaw: 0.35, pitch: 0.38, distance: 4.8, fov: 40 },
                    { ambient: 0.48, diffuse: 0.86, direction: [-0.45, 0.82, 0.62] },
                  ),
                  oceanColor: '#0b2a4a',
                  landColor: '#79a78d',
                  borderColor: '#d7e3d5',
                  pointColor: '#fb7185',
                  routeColor: '#fbbf24',
                },
              ),
          },
        ];

        if (!api) {
          status.className = 'error';
          status.textContent = '공간 bundle을 불러오지 못했습니다.';
          themeButton.disabled = true;
          return;
        }
        const themeCycle = Array.from(api.builtInThemeCatalog);
        const updateThemeControl = () => {
          const next = themeCycle[(themeIndex + 1) % themeCycle.length];
          themeButton.textContent = `${next.id} 테마`;
          themeButton.setAttribute('aria-label', `${next.id} 테마로 전환`);
        };
        updateThemeControl();
        const render = () => {
          instances.splice(0).forEach((instance) => instance.destroy());
          gallery.replaceChildren();
          try {
            for (const definition of definitions) {
              const article = document.createElement('article');
              article.innerHTML = `<div class="head"><div><h2>${definition.title}</h2><p class="copy">${definition.copy}</p><code>GraflumeSpatial.${definition.api}</code></div><span class="badge">${definition.family}</span></div><div id="${definition.id}" class="chart"></div>`;
              gallery.append(article);
              instances.push(definition.render(`#${definition.id}`));
            }
            status.className = '';
            status.textContent = `${instances.length}개 실제 GPU 공간 차트를 ${themeCycle[themeIndex].id} 테마로 렌더링했습니다.`;
          } catch (error) {
            status.className = 'error';
            status.textContent = error instanceof Error ? error.message : String(error);
          }
        };
        themeButton.addEventListener('click', () => {
          themeIndex = (themeIndex + 1) % themeCycle.length;
          updateThemeControl();
          render();
        });
        render();
        window.addEventListener('pagehide', (event) => {
          if (!event.persisted) instances.forEach((instance) => instance.destroy());
        });
        window.addEventListener('pageshow', () =>
          instances.forEach((instance) => instance.resize()),
        );
      })();
    </script>
  </body>
</html>
